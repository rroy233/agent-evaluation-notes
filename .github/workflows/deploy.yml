name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'README.md'
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 章节的 lastUpdated 取自该文件的提交时间，需要完整历史。
          fetch-depth: 0
      - uses: withastro/action@v6
        with:
          path: web
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
